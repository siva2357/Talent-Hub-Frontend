@if (report) {
<div
    class="report-card position-relative shadow-sm rounded-4 bg-white transition-all overflow-hidden h-100 d-flex flex-column border-light border">

    <!-- HEADER -->
    <div class="card-header border-0 bg-transparent px-4 pt-4 pb-0 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <div class="report-icon-wrapper rounded-circle bg-primary bg-opacity-10 d-flex justify-content-center align-items-center"
                style="width: 40px; height: 40px;">
                <i class="bi bi-file-earmark-bar-graph text-primary fs-5"></i>
            </div>
            <div>
                <span
                    class="badge bg-light text-dark border border-secondary border-opacity-25 rounded-pill px-3 fw-semibold">
                    {{ report.category }}
                </span>
            </div>
        </div>
        <div>
            <span class="small text-muted fw-medium"><i class="bi bi-calendar3 me-1"></i>{{ report.generatedDate |
                date:'mediumDate' }}</span>
        </div>
    </div>

    <!-- BODY -->
    <div class="card-body px-4 py-3 flex-grow-1">
        <h4 class="fs-5 fw-bold text-dark mb-2 line-clamp-2" style="min-height: 2.5rem;">{{ report.title }}</h4>
        <p class="text-muted small mb-0 line-clamp-3">
            {{ report.description || 'System generated analytics and data breakdown.' }}
        </p>
    </div>

    <!-- FOOTER -->
    <div
        class="card-footer border-0 bg-transparent px-4 pb-4 pt-0 d-flex justify-content-between align-items-center mt-auto">
        <div class="d-flex align-items-center text-muted small fw-medium">
            <i class="bi bi-filetype-xlsx me-2 fs-5 text-success"></i>
            {{ report.size || '1.2 MB' }}
        </div>
        <div class="d-flex gap-2">
            <app-button variant="outline-primary" size="sm" icon="bi bi-eye" label="View"
                [routerLink]="['/view-report', report.id]">
            </app-button>
            <app-button variant="primary" size="sm" icon="bi bi-download" label="Download" [loading]="isDownloading" (clicked)="downloadReport()">
            </app-button>
        </div>
    </div>

</div>
}
