<div class="dashboard-container position-relative">
  <!-- Decorative background -->
  <div class="background-decorations">
    <div class="bg-shape top-left"></div>
    <div class="bg-shape bottom-right"></div>
    <div class="bg-shape right-shape"></div>

    <div class="concentric-circles">
      <div class="circle circle-1"></div>
      <div class="circle circle-2"></div>
      <div class="circle circle-3"></div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="dashboard-content position-relative mx-auto">

    <!-- Header -->
    <header class="page-header">
      <h1>Your Meetings</h1>
      <p>Manage your upcoming and past job interview meetings.</p>
    </header>

    <!-- Meetings -->
    <div class="row meetings-grid">

      @if (isLoading) {
      <div class="col-12">
        <div class="loading-state">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </div>

      }
      <!-- Loading -->


      <!-- Meeting Cards -->
      @for (meeting of interviews; track meeting._id) {

      <div class="col-12 col-md-6 col-xl-4 meeting-column">
        <app-meet-card [interview]="meeting" (join)="onJoin($event)">
        </app-meet-card>
      </div>

      } @empty {

      <div *ngIf="!isLoading" class="col-12">
        <div class="empty-state">
          <i class="bi bi-calendar-x"></i>
          <p>No meetings or interviews scheduled at this time.</p>
        </div>
      </div>

      }

    </div>

  </div>
</div>
