<div class="dashboard-container position-relative p-4" style="min-height: 100vh;">
  <!-- Decorative background wrapper -->
  <div class="position-absolute top-0 start-0 w-100 h-100 overflow-hidden" style="pointer-events: none; z-index: 0;">
    <div class="bg-shape top-left"></div>
    <div class="bg-shape bottom-right"></div>
    <div class="bg-shape right-shape"></div>
    <div class="concentric-circles">
      <div class="circle circle-1"></div>
      <div class="circle circle-2"></div>
      <div class="circle circle-3"></div>
    </div>
  </div>

  <div class="position-relative z-1 p-4 mx-auto" style="max-width: 1400px;">
    <header class="mb-4">
      <h1 class="fw-bold fs-4 mb-1 text-dark">Your Meetings</h1>
      <p class="text-muted small mb-0">Manage your upcoming and past job interview meetings.</p>
    </header>

    <div class="row g-4">
      <!-- Loading State -->
      <div *ngIf="isLoading" class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Dynamic Meeting Cards -->
      @for (meeting of interviews; track meeting._id) {
        <div class="col-md-6 col-lg-4">
          <app-meet-card [interview]="meeting" (join)="onJoin($event)"></app-meet-card>
        </div>
      } @empty {
        <div *ngIf="!isLoading" class="col-12 text-center py-5 text-muted">
          <i class="bi bi-calendar-x fs-1 d-block mb-3"></i>
          <p>No meetings or interviews scheduled at this time.</p>
        </div>
      }
      
    </div>
  </div>
</div>
