<div class="dashboard-container position-relative p-4">
  <!-- Decorative background wrapper -->
  <div class="position-absolute top-0 start-0 w-100 h-100 overflow-hidden" style="pointer-events: none; z-index: 0;">
    <div class="bg-shape top-left"></div>
    <div class="bg-shape bottom-right"></div>
    <div class="bg-shape right-shape"></div>
    <div class="concentric-circles">
      <div class="circle circle-1"></div>
      <div class="circle circle-2"></div>
      <div class="circle circle-3"></div>
    </div>
  </div>

  <!-- Main Content Wrapper (Glassmorphism) -->
  <div class="position-relative z-1 glass-card p-4 mx-auto" style="max-width: 1400px;">
    <!-- Header -->
    <header class="mb-4">
      <h1 class="fw-bold fs-4 mb-1">Client Management</h1>
      <p class="text-muted small mb-0">Audit client activities, spent volumes, and configure access settings.</p>
    </header>



    <!-- Filter Section -->
    <section class="card shadow-sm border border-light rounded-4 mb-4 bg-white bg-opacity-75">
      <div class="card-body p-4">
        <div class="row g-3 align-items-center mb-3">
          <div class="col-md-6 col-lg-7">
            <div
              class="input-group shadow-sm rounded-pill overflow-hidden border border-primary border-opacity-25 bg-white">
              <span class="input-group-text bg-transparent border-0 text-primary ps-4"><i
                  class="bi bi-search"></i></span>
              <input type="text" class="form-control border-0 shadow-none ps-2 py-2"
                placeholder="Search by Client ID, Email...">
            </div>
          </div>
          <div class="col-md-3 col-lg-3">
            <select class="form-select shadow-sm rounded-pill border-primary border-opacity-25 text-muted py-2">
              <option selected>All Statuses</option>
              <option value="1">Active</option>
              <option value="2">Inactive</option>
            </select>
          </div>
          <div class="col-md-3 col-lg-2 d-flex gap-2">
            <button class="btn btn-primary rounded-pill shadow-sm flex-grow-1"><i class="bi bi-funnel me-1"></i>
              Apply</button>
            <button
              class="btn btn-light rounded-pill shadow-sm border border-light flex-grow-1 text-primary hover-bg-light"><i
                class="bi bi-arrow-clockwise"></i></button>
          </div>
        </div>

        <div class="d-flex align-items-center flex-wrap gap-2">
          <span class="text-dark small fw-semibold me-2">Active Filters :</span>
          <span class="badge rounded-pill filter-badge d-flex align-items-center gap-1">
            Tag <span class="badge-close">&times;</span>
          </span>
          <span class="badge rounded-pill filter-badge d-flex align-items-center gap-1">
            Tag <span class="badge-close">&times;</span>
          </span>
          <span class="badge rounded-pill filter-badge d-flex align-items-center gap-1">
            Tag <span class="badge-close">&times;</span>
          </span>
        </div>
      </div>
    </section>

    <!-- Data Table Section -->
    <section class="card shadow-sm border border-light rounded-4 mb-4 bg-white bg-opacity-75">
      <div class="card-body p-0">
        <app-table [columns]="columns" [data]="clients"></app-table>

        <ng-template #indexTpl let-row="row" let-index="index">
          <span class="ps-4 fw-semibold text-muted">{{ index + 1 }}</span>
        </ng-template>

        <ng-template #profileTpl let-row="row">
          <img [src]="row.profileImage || 'https://i.pravatar.cc/150?u=' + row.id"
            class="rounded-circle border border-2 border-white shadow-sm object-fit-cover" width="40" height="40"
            alt="Avatar">
        </ng-template>

        <ng-template #fullNameTpl let-row="row">
          <span class="d-block fw-bold text-dark">{{ row.name }}</span>
        </ng-template>

        <ng-template #emailTpl let-row="row">
          <span class="text-muted" style="font-size: 0.85rem;">{{ row.email }}</span>
        </ng-template>

        <ng-template #phoneTpl let-row="row">
          <span class="text-muted" style="font-size: 0.85rem;">{{ row.phoneNumber || 'N/A' }}</span>
        </ng-template>

        <ng-template #industryTpl let-row="row">
          <app-badge [label]="row.industry || 'Unknown'" appearance="subtle" variant="primary"></app-badge>
        </ng-template>

        <ng-template #statusTpl let-row="row">
          <app-badge [label]="row.status" appearance="subtle" [variant]="getBadgeVariant(row.status)"></app-badge>
        </ng-template>



        <ng-template #actionsTpl let-row="row">
          <div class="dropdown">
            <button class="btn btn-link text-dark p-0 text-decoration-none" type="button" data-bs-toggle="dropdown"
              aria-expanded="false" data-bs-display="static">
              <i class="bi bi-three-dots-vertical"></i>
            </button>
            <div class="dropdown-menu dropdown-menu-end p-0 border-0 bg-transparent shadow-none"
              style="min-width: auto;">
              <app-dropdown [items]="getActionItems(row)" (itemSelected)="onActionSelected($event, row)" class="d-block"
                style="position: relative;">
              </app-dropdown>
            </div>
          </div>
        </ng-template>


      </div>
    </section>


  </div>
</div>
