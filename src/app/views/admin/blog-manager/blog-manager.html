<div class="dashboard-container position-relative p-4">
  <!-- Decorative background wrapper -->
  <div class="position-absolute top-0 start-0 w-100 h-100 overflow-hidden" style="pointer-events: none; z-index: 0;">
    <div class="bg-shape top-left"></div>
    <div class="bg-shape bottom-right"></div>
    <div class="bg-shape right-shape"></div>
    <div class="concentric-circles">
      <div class="circle circle-1"></div>
      <div class="circle circle-2"></div>
      <div class="circle circle-3"></div>
    </div>
  </div>

  <!-- Main Content Wrapper (Glassmorphism) -->
  <div class="position-relative z-1 glass-card p-4 mx-auto" style="max-width: 1400px;">
    <!-- Header -->
    <header class="mb-4 d-flex justify-content-between align-items-center">
      <div>
        <h1 class="fw-bold fs-4 mb-1">Public Blog Publisher</h1>
        <p class="text-muted small mb-0">Write articles, manage publication releases, and view platform blogs.</p>
      </div>
      <button routerLink="/create-blog" class="btn btn-primary rounded-pill shadow-sm px-4 fw-semibold"><i
          class="bi bi-plus-lg me-1"></i> Add
        Blog</button>
    </header>

    <!-- Filter Section -->
    <section class="card shadow-sm border border-light rounded-4 mb-4 bg-white bg-opacity-75">
      <div class="card-body p-4">
        <div class="row g-3 align-items-center mb-3">
          <div class="col-md-5 col-lg-5">
            <app-input-field type="text" placeholder="Search blogs by title or content..." [showIcon]="true" icon="bi bi-search" label=""></app-input-field>
          </div>
          <div class="col-md-2 col-lg-2">
            <app-input-field type="select" [options]="categoryOptions" label=""></app-input-field>
          </div>
          <div class="col-md-2 col-lg-2">
            <app-input-field type="select" [options]="statusOptions" label=""></app-input-field>
          </div>
          <div class="col-md-3 col-lg-3 d-flex gap-2">
            <app-button variant="primary" label="Apply" [iconOnly]="false" (clicked)="applyFilters()"
              class="flex-grow-1"><i class="bi bi-funnel me-1"></i></app-button>
            <app-button variant="secondary" label="Reset" [iconOnly]="false" (clicked)="resetFilters()"
              class="flex-grow-1 text-primary"><i class="bi bi-arrow-clockwise"></i></app-button>
          </div>
        </div>
      </div>
    </section>

    <!-- Data Table Section -->
    <section class="card shadow-sm border border-light rounded-4 mb-4 bg-white bg-opacity-75">
      <div class="card-body p-0">
        <app-table [columns]="columns" [data]="blogs" [loading]="isLoading"
          emptyMessage="No blogs found. Create your first blog!">

          <ng-template #indexTpl let-value let-index="index">
            <span class="fw-semibold text-muted">{{ index + 1 }}</span>
          </ng-template>

          <ng-template #mediaTpl let-row="row">
            <div
              class="rounded-3 shadow-sm overflow-hidden border border-light bg-white d-flex align-items-center justify-content-center"
              style="width: 56px; height: 40px; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);">
              @if (row.featuredMedia) {
              <img [src]="row.featuredMedia" class="w-100 h-100 object-fit-cover" alt="Blog Image">
              } @else {
              <i class="bi bi-image text-muted" style="font-size: 1.2rem;"></i>
              }
            </div>
          </ng-template>

          <ng-template #titleTpl let-value>
            <span class="d-block fw-bold text-dark text-truncate" style="max-width: 200px;">{{ value }}</span>
          </ng-template>

          <ng-template #categoryTpl let-value>
            <span
              class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 rounded-pill px-3 py-1">{{
              value }}</span>
          </ng-template>

          <ng-template #statusTpl let-value>
            @if (value === 'Published') {
            <span
              class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 rounded-pill px-3 py-2 fw-semibold d-inline-flex align-items-center gap-1"><i
                class="bi bi-check-circle-fill" style="font-size: 0.5rem;"></i> Published</span>
            } @else {
            <span
              class="badge bg-warning bg-opacity-10 text-warning-dark border border-warning border-opacity-25 rounded-pill px-3 py-2 fw-semibold d-inline-flex align-items-center gap-1"><i
                class="bi bi-dash-circle-fill" style="font-size: 0.5rem;"></i> Draft</span>
            }
          </ng-template>

          <ng-template #createdTpl let-value>
            <span class="text-muted fw-semibold" style="font-size: 0.85rem;">{{ value | date:'mediumDate' }}</span>
          </ng-template>

          <ng-template #actionsTpl let-row="row">
            <app-button variant="light" size="sm" [iconOnly]="true" class="text-danger" (clicked)="deleteBlog(row._id)"
              title="Delete"><i class="bi bi-trash3-fill"></i></app-button>
          </ng-template>

        </app-table>
      </div>
    </section>

    <!-- Pagination -->
    <div class="mt-4">
      <app-pagination [currentPage]="currentPage" [pageSize]="pageSize" [totalItems]="totalItems"
        (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)"></app-pagination>
    </div>
  </div>
</div>
