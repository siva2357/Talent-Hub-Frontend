<div class="dashboard-container position-relative p-4">
  <!-- Decorative background wrapper -->
  <div class="position-absolute top-0 start-0 w-100 h-100 overflow-hidden" style="pointer-events: none; z-index: 0;">
    <div class="bg-shape top-left"></div>
    <div class="bg-shape bottom-right"></div>
    <div class="bg-shape right-shape"></div>
    <div class="concentric-circles">
      <div class="circle circle-1"></div>
      <div class="circle circle-2"></div>
      <div class="circle circle-3"></div>
    </div>
  </div>

  <!-- Main Content Wrapper (Glassmorphism) -->
  <div class="position-relative z-1 glass-card p-4 mx-auto" style="max-width: 1400px;">
    <!-- Header -->
    <header class="mb-4">
      <h1 class="fw-bold fs-4 mb-1">Reports & Analytics</h1>
      <p class="text-muted small mb-0">Generate custom spreadsheets, download active audits, and track user growth
        records.</p>
    </header>

    <div class="row g-4">
      <!-- Left Column: Generate Report -->
      <div class="col-12 col-lg-4">
        <div class="card shadow-sm border-light rounded-4 bg-white bg-opacity-75">
          <div class="card-body p-4">
            <h2 class="fs-5 fw-bold mb-4 text-dark"><i class="bi bi-magic text-primary me-2"></i>Generate AI Report</h2>

            <form>
              <div class="mb-3">
                <label class="form-label small fw-semibold text-dark"><i
                    class="bi bi-file-earmark-text text-muted me-1"></i>Report Title *</label>
                <input type="text" class="form-control rounded-pill px-4 shadow-sm py-2"
                  placeholder="e.g., Q3 Financial Audit">
              </div>

              <div class="mb-3">
                <label class="form-label small fw-semibold text-dark"><i
                    class="bi bi-tags text-muted me-1"></i>Category</label>
                <select class="form-select text-muted rounded-pill px-4 shadow-sm py-2">
                  <option selected>Select one...</option>
                  <option value="1">Financial</option>
                  <option value="2">Users</option>
                </select>
              </div>

              <div class="mb-4">
                <label class="form-label small fw-semibold text-dark"><i
                    class="bi bi-list-task text-muted me-1"></i>Scope / Description *</label>
                <textarea class="form-control rounded-4 p-3 shadow-sm" rows="4"
                  placeholder="Describe the metrics and data points you want to analyze..."></textarea>
              </div>

              <div class="d-flex gap-2 mt-4 pt-2 border-top border-light">
                <button type="button"
                  class="btn btn-outline-secondary rounded-pill flex-grow-1 bg-white text-dark shadow-sm fw-semibold">Cancel</button>
                <button type="submit"
                  class="btn btn-primary rounded-pill flex-grow-1 shadow-sm fw-semibold d-flex justify-content-center align-items-center gap-2"><i
                    class="bi bi-stars"></i> Build Report</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Right Column: Report List -->
      <div class="col-12 col-lg-8">
        <!-- Filters Row -->
        <div class="row g-2 mb-3">
          <div class="col-md-7">
            <div
              class="input-group shadow-sm rounded-pill overflow-hidden border border-primary border-opacity-25 bg-white">
              <span class="input-group-text bg-transparent border-0 text-primary ps-4"><i
                  class="bi bi-search"></i></span>
              <input type="text" class="form-control border-0 shadow-none ps-2 py-2" placeholder="Search reports...">
            </div>
          </div>
          <div class="col-md-2">
            <button
              class="btn btn-outline-secondary w-100 bg-white text-dark d-flex justify-content-between align-items-center shadow-sm rounded-pill py-2">
              <span><i class="bi bi-calendar-range text-muted me-1"></i> Date</span>
            </button>
          </div>
          <div class="col-md-3">
            <button
              class="btn btn-outline-secondary w-100 bg-white text-dark d-flex justify-content-between align-items-center shadow-sm rounded-pill py-2">
              <span><i class="bi bi-funnel text-muted me-1"></i> All Types</span>
            </button>
          </div>
        </div>

        <!-- Generated Report Item -->
        <div
          class="card shadow-sm border-light rounded-4 mb-2 report-item bg-white bg-opacity-75 transition-all hover-bg-light">
          <div class="card-body p-3 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
              <div
                class="report-icon border border-primary border-opacity-25 rounded-4 flex-shrink-0 d-flex justify-content-center align-items-center bg-primary bg-opacity-10"
                style="width: 48px; height: 48px;">
                <i class="bi bi-file-earmark-bar-graph text-primary fs-4"></i>
              </div>
              <div>
                <h3 class="fs-6 fw-bold mb-1 text-dark">Q3 Financial & Contract Audit</h3>
                <p class="text-muted small mb-0 d-flex align-items-center gap-2" style="font-size: 0.75rem;">
                  <span><i class="bi bi-calendar3"></i> Aug 14, 2026</span>
                  <span
                    class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 rounded-pill px-2 py-1">Financial</span>
                </p>
              </div>
            </div>
            <div class="d-flex gap-2">
              <button
                class="btn btn-sm btn-light text-primary rounded-circle shadow-sm border border-light d-flex justify-content-center align-items-center"
                style="width: 36px; height: 36px;" title="View Report"><i class="bi bi-eye-fill"></i></button>
              <button
                class="btn btn-sm btn-light text-success rounded-circle shadow-sm border border-light d-flex justify-content-center align-items-center"
                style="width: 36px; height: 36px;" title="Download PDF"><i class="bi bi-download"></i></button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
