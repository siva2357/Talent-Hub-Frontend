<div class="dashboard-container position-relative p-4">

  <!-- Decorative background wrapper -->
  <div class="position-absolute top-0 start-0 w-100 h-100 overflow-hidden" style="pointer-events: none; z-index: 0;">
    <div class="bg-shape top-left"></div>
    <div class="bg-shape bottom-right"></div>
    <div class="bg-shape right-shape"></div>
    <div class="concentric-circles">
      <div class="circle circle-1"></div>
      <div class="circle circle-2"></div>
      <div class="circle circle-3"></div>
    </div>
  </div>



  <!-- Main Content Wrapper -->
  <div class="position-relative z-1 p-4 mx-auto" style="max-width: 1400px;">
    <!-- Header -->
    <header class="mb-4">
      <h1 class="fw-bold fs-4 mb-1">Reports & Analytics</h1>
      <p class="text-muted small mb-0">Generate custom spreadsheets, download active audits, and track user growth
        records.</p>
    </header>

    <div class="row g-4">
      <div class="col-12">
        <!-- Filters Row -->
        <div class="row g-3 mb-4 align-items-center">
          <div class="col-md-6">
            <app-input-field placeholder="Search reports..." icon="bi bi-search">
            </app-input-field>
          </div>
          <div class="col-md-3">
            <app-button variant="outline-secondary" label="Date" icon="bi bi-calendar-range" [block]="true">
            </app-button>
          </div>
          <div class="col-md-3">
            <app-button variant="outline-secondary" label="All Types" icon="bi bi-funnel" [block]="true">
            </app-button>
          </div>
        </div>

        <!-- Generated Report Items -->
        @if (isLoading) {
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
        } @else {
        <div class="row g-4">
          @for (report of reports; track report.id) {
          <div class="col-12 col-md-6 col-xl-4">
            <app-report-card [report]="report"></app-report-card>
          </div>
          } @empty {
          <div class="col-12 text-center py-5 text-muted">
            No reports generated yet.
          </div>
          }
        </div>
        }

      </div>
    </div>
  </div>
</div>
