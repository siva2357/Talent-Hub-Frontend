<div class="management-container p-4">
  <!-- Header -->
  <header class="mb-4">
    <h1 class="fw-bold fs-4 mb-1">Reports & Analytics</h1>
    <p class="text-muted small mb-0">Generate custom spreadsheets, download active audits, and track user growth records.</p>
  </header>

  <div class="row g-4">
    <!-- Left Column: Generate Report -->
    <div class="col-12 col-lg-4">
      <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">
          <h2 class="fs-6 fw-bold mb-4">Generate Report - using AI</h2>
          
          <form>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Report Title *</label>
              <input type="text" class="form-control" placeholder="">
            </div>
            
            <div class="mb-3">
              <label class="form-label small fw-semibold">Category</label>
              <select class="form-select text-muted">
                <option selected>Select one...</option>
                <option value="1">Financial</option>
                <option value="2">Users</option>
              </select>
            </div>
            
            <div class="mb-4">
              <label class="form-label small fw-semibold">Scope / Description *</label>
              <textarea class="form-control" rows="4" placeholder="Type your message..."></textarea>
            </div>
            
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-outline-secondary flex-grow-1 bg-white text-dark">Cancel</button>
              <button type="submit" class="btn btn-primary flex-grow-1">Build Report</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Right Column: Report List -->
    <div class="col-12 col-lg-8">
      <!-- Filters Row -->
      <div class="row g-2 mb-3">
        <div class="col-md-7">
          <div class="input-group shadow-sm rounded-3">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i>&#128269;</span>
            <input type="text" class="form-control border-start-0 ps-0" placeholder="Search">
          </div>
        </div>
        <div class="col-md-2">
          <button class="btn btn-outline-secondary w-100 bg-white text-start d-flex justify-content-between align-items-center shadow-sm">
            <span>&#9776; Date</span>
          </button>
        </div>
        <div class="col-md-3">
          <button class="btn btn-outline-secondary w-100 bg-white text-start d-flex justify-content-between align-items-center shadow-sm">
            <span>&#9776; All</span>
          </button>
        </div>
      </div>
      
      <!-- Generated Report Item -->
      <div class="card shadow-sm border-0 rounded-3 mb-2 report-item">
        <div class="card-body p-3 d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center gap-3">
            <div class="report-icon border border-primary border-opacity-25 rounded-3 flex-shrink-0" style="width: 40px; height: 40px; background-color: #93c5fd;"></div>
            <div>
              <h3 class="fs-6 fw-bold mb-0">Report Title</h3>
              <p class="text-muted small mb-0" style="font-size: 0.7rem;">Report Title<br>Report Title</p>
            </div>
          </div>
          <button class="btn btn-outline-secondary bg-white rounded-3 px-3 py-2 border">&nbsp;&nbsp;&nbsp;&nbsp;</button>
        </div>
      </div>
      
    </div>
  </div>
</div>
