<div
    class="otp-layout position-relative d-flex flex-column align-items-center justify-content-center bg-light-purple w-100">
    <!-- Decorative background elements -->
    <div class="bg-shape top-left"></div>
    <div class="bg-shape bottom-left"></div>
    <div class="bg-shape right-shape"></div>

    <div class="concentric-circles z-0">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>
    <div class="concentric-circles-right z-0">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <!-- Main Content -->
    <div class="form-container z-1 text-center w-100 px-3" style="max-width: 480px;">
        <img src="/logo 2.png" alt="Talent Hub" class="logo mb-5" />

        <div
            class="icon-circle mx-auto bg-white d-flex align-items-center justify-content-center position-relative shadow-sm mb-4">
            <i class="bi bi-envelope-fill text-primary" style="font-size: 2.5rem;"></i>
            <div class="badge-icon bg-white text-primary rounded-circle shadow-sm">
                <i class="bi bi-lock-fill"></i>
            </div>
        </div>

        <h2 class="fw-bold fs-3 text-dark mb-3">Forgot Password?</h2>
        <p class="text-muted small mb-4">No worries! Enter your email address and we'll<br>send you a link to reset your
            password.</p>

        <form [formGroup]="forgotPasswordForm" (ngSubmit)="sendResetCode()">
            <div class="text-start mb-4">
                <app-input-field label="Email Address" type="email" placeholder="Enter your email address"
                    icon="bi bi-envelope" [showIcon]="true" [value]="forgotPasswordForm.get('email')?.value || ''"
                    (valueChange)="forgotPasswordForm.get('email')?.setValue($event); forgotPasswordForm.get('email')?.markAsTouched()"
                    [required]="true" [validation]="getValidationState('email')"
                    [errorMessage]="getErrorMessage('email')">
                </app-input-field>
            </div>

            @if (errorMessage) {
            <div class="alert alert-danger py-2 small mb-3 text-start">
                {{ errorMessage }}
            </div>
            }

            <div class="mb-4">
                <app-button type="submit" variant="primary" class="w-100 py-3 rounded-3 fw-bold shadow-sm d-flex align-items-center justify-content-center"
                    [loading]="isLoading" [disabled]="isLoading"
                    [label]="isLoading ? 'Sending...' : 'Send Reset Link'">
                    @if (!isLoading) {
                    <i class="bi bi-send-fill me-2"></i>
                    }
                </app-button>
            </div>
        </form>

        <p class="text-muted small">Remember your password? <a routerLink="/login"
                class="text-primary fw-bold text-decoration-none">Log in</a></p>
    </div>
</div>
