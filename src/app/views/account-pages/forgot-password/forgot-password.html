<div class="otp-layout position-relative d-flex flex-column align-items-center justify-content-center bg-light-purple w-100">
    <!-- Decorative background elements -->
    <div class="bg-shape top-left"></div>
    <div class="bg-shape bottom-left"></div>
    <div class="bg-shape right-shape"></div>
    
    <div class="concentric-circles z-0">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>
    <div class="concentric-circles-right z-0">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <!-- Main Content -->
    <div class="form-container z-1 text-center w-100 px-3" style="max-width: 480px;">
        <img src="/logo 2.png" alt="Talent Hub" class="logo mb-5" />
        
        <div class="icon-circle mx-auto bg-white d-flex align-items-center justify-content-center position-relative shadow-sm mb-4">
            <i class="bi bi-envelope-fill text-primary" style="font-size: 2.5rem;"></i>
            <div class="badge-icon bg-white text-primary rounded-circle shadow-sm">
                <i class="bi bi-lock-fill"></i>
            </div>
        </div>
        
        <h2 class="fw-bold fs-3 text-dark mb-3">Forgot Password?</h2>
        <p class="text-muted small mb-4">No worries! Enter your email address and we'll<br>send you a link to reset your password.</p>
        
        <div class="text-start mb-4">
            <label class="form-label small fw-bold text-dark mb-2">Email Address</label>
            <div class="input-group input-group-lg shadow-sm border border-secondary border-opacity-25 rounded-3 overflow-hidden bg-white">
                <span class="input-group-text bg-white border-0 text-muted px-3"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control border-0 shadow-none px-2" placeholder="Enter your email address" style="font-size: 0.95rem;" [(ngModel)]="email" name="email" required>
            </div>
        </div>
        
        <div *ngIf="errorMessage" class="alert alert-danger py-2 small mb-3 text-start">
            {{ errorMessage }}
        </div>
        
        <button type="button" class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-sm d-flex align-items-center justify-content-center mb-4" (click)="sendResetCode()" [disabled]="isLoading">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            <i *ngIf="!isLoading" class="bi bi-send-fill me-2"></i> {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
        </button>
        
        <a routerLink="/login" class="text-primary text-decoration-none fw-bold small d-block mb-4">
            <i class="bi bi-arrow-left me-1"></i> Back to Login
        </a>
        
        <p class="text-muted small">Remember your password? <a routerLink="/login" class="text-primary fw-bold text-decoration-none">Log in</a></p>
    </div>
</div>
