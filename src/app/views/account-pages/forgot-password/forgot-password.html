<div class="otp-layout position-relative d-flex flex-column align-items-center justify-content-center bg-light-purple w-100">
    <!-- Decorative background elements (wrapped with overflow-hidden to eliminate overscroll) -->
    <div class="position-absolute top-0 start-0 w-100 h-100 overflow-hidden" style="pointer-events: none; z-index: 0;">
        <div class="bg-shape top-left"></div>
        <div class="bg-shape bottom-left"></div>
        <div class="bg-shape right-shape"></div>

        <div class="concentric-circles">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
        <div class="concentric-circles-right">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="form-container forgot-form-container z-1 text-center w-100">
        <img src="/logo 2.png" alt="Talent Hub" class="logo mb-4" />

        <div class="icon-circle mx-auto d-flex align-items-center justify-content-center position-relative mb-4">
            <i class="bi bi-envelope-fill text-primary"></i>
            <div class="badge-icon rounded-circle">
                <i class="bi bi-lock-fill"></i>
            </div>
        </div>

        <h2 class="fw-bold fs-3 text-dark mb-2">Forgot Password?</h2>
        <p class="text-muted small forgot-instruction mb-4">
            No worries! Enter your email address and we'll send you a link to reset your password.
        </p>

        <form [formGroup]="forgotPasswordForm" (ngSubmit)="sendResetCode()" class="forgot-form text-start">
            <div class="mb-4">
                <app-input-field label="Email Address" type="email" placeholder="Enter your email address"
                    icon="bi bi-envelope" [showIcon]="true" [value]="forgotPasswordForm.get('email')?.value || ''"
                    (valueChange)="forgotPasswordForm.get('email')?.setValue($event); forgotPasswordForm.get('email')?.markAsTouched()"
                    [required]="true" [validation]="getValidationState('email')"
                    [errorMessage]="getErrorMessage('email')">
                </app-input-field>
            </div>

            @if (errorMessage) {
            <div class="alert alert-danger py-2 small mb-3">
                {{ errorMessage }}
            </div>
            }

            <div class="mb-4">
                <app-button type="submit" variant="primary" size="md" [block]="true"
                    [loading]="isLoading" [disabled]="isLoading"
                    [label]="isLoading ? 'Sending...' : 'Send Reset Link'">
                    @if (!isLoading) {
                    <i class="bi bi-send-fill me-2"></i>
                    }
                </app-button>
            </div>
        </form>

        <p class="text-muted small login-back-link mb-0">
            Remember your password?
            <a routerLink="/login" class="text-primary fw-bold text-decoration-none ms-1">Log in</a>
        </p>
    </div>
</div>
