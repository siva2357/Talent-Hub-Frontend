<div class="login-layout container-fluid p-0">
    <div class="row g-0 h-100">

        <!-- ==============================
             LEFT: LOGIN FORM
        =============================== -->
        <div class="col-lg-6 d-flex flex-column bg-white position-relative left-panel">

            <!-- Decorative background -->
            <div class="position-absolute w-100 h-100 overflow-hidden decorative-bg">
                <div class="bg-shape top-left"></div>
                <div class="bg-shape bottom-left"></div>
            </div>

            <!-- Login Form -->
            <div class="form-container">

                <div class="text-center mb-5">

                    <img src="/logo 2.png" alt="Talent Hub" class="logo mb-3" />

                    <h2 class="fw-bold fs-3 text-dark">
                        Welcome Back
                    </h2>

                    <p class="text-muted small">
                        Login to continue to your account.
                    </p>

                </div>

                <form [formGroup]="loginForm" (ngSubmit)="login()" class="static-form">

                    <!-- Email -->
                    <div class="mb-4">

                        <app-input-field label="Email Address" type="email" placeholder="Enter your email address"
                            icon="bi bi-envelope" [showIcon]="true" [value]="loginForm.get('email')?.value || ''"
                            (valueChange)="loginForm.get('email')?.setValue($event); loginForm.get('email')?.markAsDirty()"
                            (blurred)="loginForm.get('email')?.markAsTouched()"
                            [validation]="getValidationState('email')" [errorMessage]="getErrorMessage('email')">
                        </app-input-field>

                    </div>

                    <!-- Password -->
                    <div class="mb-2">

                        <app-input-field label="Password" type="password" placeholder="Enter your password"
                            icon="bi bi-lock" [showIcon]="true" [showPasswordToggle]="true"
                            [value]="loginForm.get('password')?.value || ''"
                            (valueChange)="loginForm.get('password')?.setValue($event); loginForm.get('password')?.markAsDirty()"
                            (blurred)="loginForm.get('password')?.markAsTouched()"
                            [validation]="getValidationState('password')" [errorMessage]="getErrorMessage('password')">
                        </app-input-field>

                    </div>

                    <!-- Forgot Password -->
                    <div class="d-flex justify-content-end mb-4">

                        <a routerLink="/forgot-password" class="text-primary text-decoration-none small fw-semibold">
                            Forgot password?
                        </a>

                    </div>

                    <!-- Error -->
                    @if (errorMessage) {

                    <div class="alert alert-danger py-2 small mb-3">
                        {{ errorMessage }}
                    </div>

                    }

                    <!-- Login Button -->
                    <app-button type="submit" [loading]="isLoading" label="Log In" variant="primary" [block]="true"
                        class="w-100 d-block">

                        @if (!isLoading) {
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        }

                    </app-button>

                    <!-- Register -->
                    <div class="text-center mt-5 pb-4">

                        <span class="text-muted small">
                            Don't have an account?
                        </span>

                        <a routerLink="/register" class="text-primary text-decoration-none fw-bold small">
                            Sign up
                        </a>

                    </div>

                </form>

            </div>

        </div>


        <!-- ==============================
             RIGHT: IMAGE PLACEHOLDER
        =============================== -->
        <div class="col-lg-6 d-none d-lg-flex right-column">

            <div class="image-placeholder">

                <img src="/assets/images/talent-banner.png" alt="Talent Hub" class="banner-image" />

            </div>

        </div>

    </div>
</div>
