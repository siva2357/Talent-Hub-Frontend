<div class="login-layout">
    <!-- Left Panel with Form -->
    <div class="left-panel">
        <div class="form-container">
            <img src="/logo 2.png" alt="Talent Hub" class="logo" />

            <div class="login-card">
                <div class="header">
                    <h1 class="title">Welcome Back</h1>
                    <p class="subtitle">Login to continue to your account</p>
                </div>

                <div class="static-form">
                    <div class="form-group">
                        <input type="email" id="email" class="form-control" name="email" placeholder="Email*" required>
                    </div>

                    <div class="form-group">
                        <input type="password" id="password" class="form-control" name="password" placeholder="Password*" required>
                        <div class="forgot-wrapper">
                            <a class="forgot-link" routerLink="/forgot-password">Forgot your password?</a>
                        </div>
                    </div>

                    <button type="button" class="btn-primary" (click)="login()">Log in</button>
                </div>

                <div class="signup-link">
                    Don't have an account? <a routerLink="/register">Sign Up</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Panel Placeholder for Banner -->
    <div class="right-panel"></div>
</div>
