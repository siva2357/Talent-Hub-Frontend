<div class="register-layout">
    <!-- Left Panel with Form -->
    <div class="left-panel">
        <div class="form-container">
            <img src="/logo 2.png" alt="Talent Hub" class="logo" />

            <div class="register-card">
                <div class="header">
                    <h1 class="title">Create your account</h1>
                    <p class="subtitle">Join Talent Hub and start your journey today.</p>
                </div>

                <div class="static-form">
                    <div class="form-group">
                        <input type="text" id="fullname" class="form-control" name="fullname" placeholder="Full Name"
                            required>
                    </div>

                    <div class="form-group">
                        <input type="email" id="email" class="form-control" name="email" placeholder="Email" required>
                    </div>

                    <div class="form-group">
                        <input type="password" id="password" class="form-control" name="password" placeholder="Password"
                            required>
                    </div>

                    <button type="button" class="btn-primary" (click)="createAccount()">Create Account</button>
                </div>

                <div class="login-link">
                    Already have an account? <a routerLink="/login">Log In</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Panel Placeholder for Banner -->
    <div class="right-panel"></div>
</div>
