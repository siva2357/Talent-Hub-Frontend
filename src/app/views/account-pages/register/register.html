<div class="register-layout container-fluid p-0">
  <div class="row g-0 h-100">

    <!-- ==============================
             LEFT: REGISTER FORM
        =============================== -->
    <div class="col-lg-6 d-flex flex-column bg-white position-relative left-panel">

      <!-- Back -->
      <a routerLink="/signup" class="back-link text-primary text-decoration-none fw-semibold small">

        <i class="bi bi-arrow-left me-1"></i>
        Back to Role Selection

      </a>


      <!-- Form Container -->
      <div class="form-container">

        <!-- Header -->
        <header class="text-center">

          <img src="/logo 2.png" alt="Talent Hub" class="logo mb-3">

          <h1 class="fw-bold fs-3 text-dark">
            Create your account
          </h1>

          <p class="text-muted small mb-0">
            Join Talent Hub and start your journey today.
          </p>

        </header>


        <!-- Registration Form -->
        <form [formGroup]="registerForm" (ngSubmit)="createAccount()" class="static-form" novalidate>

          <!-- Full Name -->
          <div class="mb-3">

            <app-input-field label="Full Name" type="text" placeholder="Enter your full name" icon="bi bi-person"
              [showIcon]="true" [value]="registerForm.get('fullName')?.value || ''"
              [validation]="getValidationState('fullName')" [errorMessage]="getErrorMessage('fullName')" (valueChange)="
                                registerForm.get('fullName')?.setValue($event);
                                registerForm.get('fullName')?.markAsDirty()
                            " (blurred)="
                                registerForm.get('fullName')?.markAsTouched()
                            ">
            </app-input-field>

          </div>


          <!-- Email -->
          <div class="mb-3">

            <app-input-field label="Email Address" type="email" placeholder="Enter your email address"
              icon="bi bi-envelope" [showIcon]="true" [value]="registerForm.get('email')?.value || ''"
              [validation]="getValidationState('email')" [errorMessage]="getErrorMessage('email')" (valueChange)="
                                registerForm.get('email')?.setValue($event);
                                registerForm.get('email')?.markAsDirty()
                            " (blurred)="
                                registerForm.get('email')?.markAsTouched()
                            ">
            </app-input-field>

          </div>


          <!-- Password -->
          <div class="mb-4">

            <app-input-field label="Password" type="password" placeholder="Create a strong password" icon="bi bi-lock"
              [showIcon]="true" [showPasswordToggle]="true" [value]="registerForm.get('password')?.value || ''"
              [validation]="getValidationState('password')" [errorMessage]="getErrorMessage('password')" (valueChange)="
                                registerForm.get('password')?.setValue($event);
                                registerForm.get('password')?.markAsDirty()
                            " (blurred)="
                                registerForm.get('password')?.markAsTouched()
                            ">
            </app-input-field>

          </div>


          <!-- Server Error -->
          @if (errorMessage) {

          <div class="alert alert-danger py-2 small mb-3" role="alert">

            {{ errorMessage }}

          </div>

          }


          <!-- Create Account -->
          <app-button type="submit" [loading]="isLoading" label="Create Account" variant="primary" [block]="true"
            class="w-100 d-block">

            @if (!isLoading) {

            <i class="bi bi-person-plus-fill me-2" aria-hidden="true">
            </i>

            }

          </app-button>


          <!-- Login -->
          <div class="text-center mt-5 pb-4">

            <span class="text-muted small">
              Already have an account?
            </span>

            <a routerLink="/login" class="text-primary text-decoration-none fw-bold small">
              Log in
            </a>

          </div>

        </form>

      </div>

    </div>


    <!-- ==============================
             RIGHT: IMAGE PLACEHOLDER
        =============================== -->
    <div class="col-lg-6 d-none d-lg-flex right-column">

      <div class="image-placeholder">

        <img src="/assets/images/talent-banner.png" alt="Talent Hub" class="banner-image">

      </div>

    </div>

  </div>
</div>
