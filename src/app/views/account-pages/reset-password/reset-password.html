<div class="reset-layout">
    <div class="left-panel">
        <div class="form-container">
            <img src="/logo 2.png" alt="Talent Hub" class="logo" />

            <div class="reset-card">
                <div class="header">
                    <h1 class="title">Reset Password</h1>
                    <p class="subtitle">Enter new password to regain access to your account</p>
                </div>

                <div class="static-form">
                    <div class="form-group">
                        <input type="password" id="newPassword" class="form-control" name="newPassword"
                            placeholder="New password*" required>
                    </div>

                    <div class="form-group">
                        <input type="password" id="confirmPassword" class="form-control" name="confirmPassword"
                            placeholder="Confirm password*" required>
                    </div>

                    <button type="button" class="btn-primary" (click)="resetPassword()">Reset password</button>
                </div>

                <a class="back-link" routerLink="/login">Back to Login</a>
            </div>
        </div>
    </div>

    <div class="right-panel"></div>
</div>
