<div class="otp-layout position-relative d-flex flex-column align-items-center justify-content-center bg-light-purple w-100">
    <!-- Decorative background elements -->
    <div class="bg-shape top-left"></div>
    <div class="bg-shape bottom-left"></div>
    <div class="bg-shape right-shape"></div>
    
    <div class="concentric-circles z-0">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>
    <div class="concentric-circles-right z-0">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <!-- Main Content -->
    <div class="form-container z-1 text-center w-100 px-3" style="max-width: 480px;">
        <img src="/logo 2.png" alt="Talent Hub" class="logo mb-5" />
        
        <div class="icon-circle mx-auto bg-white d-flex align-items-center justify-content-center position-relative shadow-sm mb-4">
            <i class="bi bi-envelope-fill text-primary" style="font-size: 2.5rem;"></i>
            <div class="badge-icon bg-white text-primary rounded-circle shadow-sm">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
        </div>
        
        <h2 class="fw-bold fs-3 text-dark mb-3">Verify Your Email</h2>
        <p class="text-muted small mb-1">We've sent a 6-digit verification code to</p>
        <p class="fw-bold text-primary mb-4" style="font-size: 0.95rem;">sivaprasad@example.com <i class="bi bi-pencil-fill ms-1 cursor-pointer"></i></p>
        
        <p class="text-muted small mb-3">Enter the 6-digit code below</p>
        
        <div class="otp-inputs-wrapper d-flex justify-content-center gap-2 mb-4">
            <input type="text" class="form-control otp-input text-primary" maxlength="1" value="l">
            <input type="text" class="form-control otp-input" maxlength="1">
            <input type="text" class="form-control otp-input" maxlength="1">
            <input type="text" class="form-control otp-input" maxlength="1">
            <input type="text" class="form-control otp-input" maxlength="1">
            <input type="text" class="form-control otp-input" maxlength="1">
        </div>
        
        <p class="text-muted small mb-4">Didn't receive the code? <a href="#" class="text-primary fw-bold text-decoration-none">Resend OTP</a> in <span class="text-primary fw-bold">00:45</span></p>
        
        <button type="button" class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-sm d-flex align-items-center justify-content-center mb-4" (click)="verify()">
            Verify & Continue <i class="bi bi-arrow-right ms-2"></i>
        </button>
        
        <a routerLink="/login" class="text-primary text-decoration-none fw-bold small">
            <i class="bi bi-arrow-left me-1"></i> Back to Login
        </a>
    </div>
</div>
