<div class="dashboard-container position-relative p-4">
  <!-- Decorative background wrapper -->
  <div class="position-absolute top-0 start-0 w-100 h-100 overflow-hidden" style="pointer-events: none; z-index: 0;">
    <div class="bg-shape top-left"></div>
    <div class="bg-shape bottom-right"></div>
    <div class="bg-shape right-shape"></div>
    <div class="concentric-circles">
      <div class="circle circle-1"></div>
      <div class="circle circle-2"></div>
      <div class="circle circle-3"></div>
    </div>
  </div>

  <!-- Main Content Wrapper (Glassmorphism) -->
  <div class="position-relative z-1 p-4 mx-auto" style="max-width: 1400px;">
    <!-- Header -->
    <header class="mb-4">
      <h1 class="fw-bold fs-3 mb-1 text-dark">Get to know your Talents</h1>
      <p class="text-muted small mb-0">Discover skilled professionals and find the perfect match for your projects.</p>
    </header>

    <!-- Filter Card -->
    <div class="glass-card rounded-3 mb-4 p-4 bg-white">
      <div class="row g-3 mb-3">
        <!-- Row 1 -->
        <div class="col-md-3">
          <label class="form-label text-muted fw-bold mb-1" style="font-size: 0.75rem;">Skills</label>
          <select class="form-select text-dark" style="font-size: 0.8rem;">
            <option>All Skills</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label text-muted fw-bold mb-1" style="font-size: 0.75rem;">Experience Level</label>
          <select class="form-select text-dark" style="font-size: 0.8rem;">
            <option>All Levels</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label text-muted fw-bold mb-1" style="font-size: 0.75rem;">Availability</label>
          <select class="form-select text-dark" style="font-size: 0.8rem;">
            <option>All Availability</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label text-muted fw-bold mb-1" style="font-size: 0.75rem;">Hourly Rate</label>
          <select class="form-select text-dark" style="font-size: 0.8rem;">
            <option>All Rates</option>
          </select>
        </div>

        <!-- Row 2 -->
        <div class="col-md-3">
          <label class="form-label text-muted fw-bold mb-1" style="font-size: 0.75rem;">Location</label>
          <select class="form-select text-dark" style="font-size: 0.8rem;">
            <option>All Locations</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label text-muted fw-bold mb-1" style="font-size: 0.75rem;">Languages</label>
          <select class="form-select text-dark" style="font-size: 0.8rem;">
            <option>All Languages</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label text-muted fw-bold mb-1" style="font-size: 0.75rem;">Job Success</label>
          <select class="form-select text-dark" style="font-size: 0.8rem;">
            <option>All Ratings</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label text-muted fw-bold mb-1" style="font-size: 0.75rem;">Sort By</label>
          <select class="form-select text-dark" style="font-size: 0.8rem;">
            <option>Best Match</option>
          </select>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary rounded-pill fw-semibold shadow-sm btn-sm px-4 fw-semibold">Apply
          Filters</button>
        <button class="btn btn-outline-secondary bg-white btn-sm px-4 fw-semibold">Clear All</button>
      </div>
    </div>

    <!-- Talent Grid -->
    <div class="row g-4">

      @if(isLoading) {
      <div class="col-12 text-center py-5">
        <span class="spinner-border text-primary" role="status"></span>
        <p class="mt-2 text-muted">Loading talents...</p>
      </div>
      } @else {
      @for(freelancer of freelancers; track freelancer._id) {
      <!-- Talent Card -->
      <div class="col-md-4">
        <app-talent-card [talent]="freelancer" (viewProfile)="viewProfile($event.userId)"></app-talent-card>
      </div>
      } @empty {
      <div class="col-12 text-center py-5">
        <p class="text-muted mb-0">No talents found matching your criteria.</p>
      </div>
      }
      }
    </div>
  </div>
</div>
