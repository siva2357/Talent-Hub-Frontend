<article class="blog-card">

    <!-- =========================
         BLOG IMAGE
    ========================== -->
    <div class="blog-card-image">

        @if (blog.imageUrl) {

        <img [src]="blog.imageUrl" [alt]="blog.title" loading="lazy" class="blog-image">

        } @else {

        <div class="blog-image-placeholder">

            <i class="bi bi-image"></i>

        </div>

        }

    </div>


    <!-- =========================
         BLOG CONTENT
    ========================== -->
    <div class="blog-card-body">

        <!-- Category -->
        @if (blog.category) {

        <span class="blog-category">
            {{ blog.category }}
        </span>

        }


        <!-- Title -->
        <h2 class="blog-card-title">
            {{ blog.title }}
        </h2>


        <!-- Description -->
        <p class="blog-card-description">
            {{ blog.description }}
        </p>


        <!-- Details -->
        <button type="button" class="blog-details-link" (click)="onViewDetails()">

            <span>
                View details
            </span>

            <i class="bi bi-arrow-right"></i>

        </button>


        <!-- Meta -->
        <div class="blog-card-meta">

            <span class="blog-date">
                {{ formatDate(blog.publishedAt) }}
            </span>

            <span class="blog-read-time">
                {{ getReadTime() }}
            </span>

        </div>

    </div>

</article>
