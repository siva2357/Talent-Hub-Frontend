@if (stat) {

<div class="stat-card">

    <div class="stat-card-content">

        <!-- Icon -->

        <div class="stat-card-icon">

            <i [class]="stat.icon"></i>

        </div>


        <!-- Content -->

        <div class="stat-card-info">

            <span class="stat-card-title">
                {{ stat.title }}
            </span>

            <strong class="stat-card-value">
                {{ stat.value }}
            </strong>

        </div>

    </div>

</div>

}
