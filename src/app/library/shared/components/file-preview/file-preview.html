@if (mode === 'image') {

<div class="w-100 h-100">
    @if (previewUrl) {
    <div class="image-gallery-card h-100">
        <img [src]="previewUrl" alt="Image Preview" style="width: 100%; height: 100%; object-fit: cover; max-height: 216px;">
    </div>
    } @else {
    <div class="text-muted small p-4 border rounded text-center w-100 h-100 d-flex flex-column justify-content-center align-items-center" style="min-height: 216px; border: 2px dashed #e5e7eb !important; background-color: #f8fafc;">
        <i class="bi bi-image text-secondary mb-2" style="font-size: 24px;"></i>
        No preview available
    </div>
    }
</div>

}


@if (mode === 'profile') {

<div class="profile-preview-card">

    <div class="profile-preview-avatar">

        <img [src]="previewUrl || 'https://i.pravatar.cc/150?img=11'" alt="Profile">

        <div class="profile-preview-camera" style="cursor: pointer;" (click)="editClicked.emit()">
            <i class="bi bi-pencil-fill"></i>
        </div>

    </div>

</div>

}


@if (mode === 'document') {
<div class="document-preview">
    @for (file of files; track $index) {
    <div class="file-list-item">
        <div class="file-icon-box bg-generic">
            <i class="bi bi-file-earmark"></i>
        </div>
        <div class="file-info">
            <div class="file-name">
                {{ file.fileName || file.name || 'Document' }}
            </div>
            <div class="file-meta">
                {{ file.fileSize || file.size || '' }} &bull; 
                <a [href]="file.fileUrl || file.url || '#'" target="_blank">View File</a>
            </div>
        </div>
        <div class="file-actions">
            <button class="btn-icon-light" (click)="downloadClicked.emit(file)" *ngIf="file.fileUrl || file.url">
                <i class="bi bi-download"></i>
            </button>
            <button class="btn-icon-light" (click)="removeClicked.emit($index)">
                <i class="bi bi-x"></i>
            </button>
        </div>
    </div>
    }
</div>
}
