<div class="card h-100 border-light shadow-sm rounded-4">
  <div class="card-body p-4 d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div class="badge" 
           [ngClass]="{
             'bg-primary bg-opacity-10 text-primary': report?.category === 'Financial',
             'bg-success bg-opacity-10 text-success': report?.category === 'Users',
             'bg-warning bg-opacity-10 text-warning': report?.category === 'Contracts',
             'bg-secondary bg-opacity-10 text-secondary': !['Financial', 'Users', 'Contracts'].includes(report?.category)
           }">
        {{ report?.category }}
      </div>
      <span class="text-muted small"><i class="bi bi-clock me-1"></i>{{ report?.generatedDate | date:'mediumDate' }}</span>
    </div>
    
    <h5 class="card-title fw-bold mb-2">{{ report?.title }}</h5>
    <p class="card-text text-muted small flex-grow-1">{{ report?.description }}</p>
    
    <div class="d-flex align-items-center justify-content-between mt-4">
      <span class="text-muted small"><i class="bi bi-file-earmark-excel me-1"></i>Excel Report</span>
      
      <button class="btn btn-primary btn-sm rounded-pill px-3" (click)="downloadReport()" [disabled]="isDownloading">
        @if (isDownloading) {
          <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> Downloading...
        } @else {
          <i class="bi bi-download me-1"></i> Download
        }
      </button>
    </div>
  </div>
</div>
