@if (report) {
<div class="report-card h-100 d-flex flex-column position-relative rounded-4 overflow-hidden">
  <!-- Top color accent bar -->
  <div class="report-accent-bar" [ngClass]="'accent-' + categoryVariant"></div>

  <div class="card-body p-4 d-flex flex-column flex-grow-1">
    <!-- Header: Icon Box + Badge + Date -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="d-flex align-items-center gap-2">
        <div class="report-icon-box rounded-3 d-flex align-items-center justify-content-center"
          [ngClass]="'icon-box-' + categoryVariant">
          <i [class]="categoryIcon"></i>
        </div>
        <app-badge [label]="report.category || report.type || 'General'" [variant]="categoryVariant"
          appearance="subtle" [rounded]="true">
        </app-badge>
      </div>

      <span class="report-date text-muted small">
        <i class="bi bi-calendar3 me-1"></i>
        {{ (report.generatedDate || report.createdAt) | date:'mediumDate' }}
      </span>
    </div>

    <!-- Title & Description -->
    <div class="report-body-content flex-grow-1 mb-3">
      <h3 class="report-title fs-5 fw-bold mb-2 text-dark">
        {{ report.title }}
      </h3>
      <p class="report-description text-muted small mb-0">
        {{ report.description || 'System generated analytics and data breakdown.' }}
      </p>
    </div>

    <!-- Footer: File info + Action buttons -->
    <div class="report-footer d-flex align-items-center justify-content-between pt-3 mt-auto border-top border-light-subtle">
      <div class="report-file-pill d-inline-flex align-items-center gap-1 px-2 py-1 rounded-2 text-muted small">
        <i class="bi bi-file-earmark-excel text-success fs-6"></i>
        <span class="fw-semibold text-secondary">{{ report.size || report.fileSize || '120 KB' }}</span>
      </div>

      <div class="report-actions d-flex align-items-center gap-2">
        <app-button variant="outline-primary" size="sm" label="View"
          [route]="'/view-report/' + (report._id || report.id)">
        </app-button>
        <app-button variant="primary" size="sm" label="Download"
          [loading]="isDownloading" (clicked)="downloadReport()">
          <i class="bi bi-download me-1"></i>
        </app-button>
      </div>
    </div>
  </div>
</div>
}
