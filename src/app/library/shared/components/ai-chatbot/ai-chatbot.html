<div class="chatbot-wrapper position-fixed bottom-0 end-0 m-4" style="z-index: 1050;">

  @if(isOpen) {
  <div class="chatbot-window bg-white rounded-3 shadow-lg d-flex flex-column mb-3"
    style="width: 320px; height: 420px; border: 1px solid #e5e7eb;">
    <div class="chatbot-header p-3 bg-primary text-white rounded-top d-flex justify-content-between align-items-center">
      <h6 class="mb-0 fw-semibold">AI Assistant</h6>
      <button class="btn btn-sm btn-link text-white p-0" (click)="toggleChat()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="chatbot-body flex-grow-1 p-3 overflow-y-auto">
      <div class="text-center text-muted small mt-2">
        Start chatting with the AI!
      </div>
    </div>

    <div class="chatbot-footer p-3 border-top">
      <div class="input-group">
        <input type="text" class="form-control rounded-pill me-2" placeholder="Ask something...">
        <button class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center"
          style="width: 40px; height: 40px;">
          <i class="bi bi-send-fill"></i>
        </button>
      </div>
    </div>
  </div>
  }

  <!-- Floating Toggle Button -->
  <button
    class="btn bg-white rounded-circle shadow-lg d-flex align-items-center justify-content-center ms-auto p-0 border border-dark overflow-hidden"
    style="width: 60px; height: 60px;" (click)="toggleChat()">
    <img src="/AI intelligence.png" alt="AI Chatbot" style="width: 100%; height: 100%; object-fit: cover;">
  </button>

</div>
