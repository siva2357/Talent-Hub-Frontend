<div class="chatbot-wrapper">

  <!-- =========================
       CHAT WINDOW
  ========================== -->
  @if (isOpen) {

  <div class="chatbot-window">

    <!-- Header -->
    <div class="chatbot-header">

      <div class="chatbot-header-left">

        <div class="chatbot-logo">
          <i class="bi bi-robot"></i>
        </div>

        <div class="chatbot-title-wrapper">
          <h6 class="chatbot-title">Talent-Hub AI</h6>

          <small class="chatbot-subtitle">
            Powered by Gemini
          </small>
        </div>

      </div>

      <button type="button" class="chatbot-close" aria-label="Close chatbot" (click)="toggleChat()">

        <i class="bi bi-x-lg"></i>

      </button>

    </div>


    <!-- =========================
           CHAT BODY
      ========================== -->
    <div class="chatbot-body" #chatBody>

      <!-- Empty State -->
      @if (messages.length === 0 && !isLoading) {

      <div class="chatbot-empty">

        <i class="bi bi-chat-square-stars chatbot-empty-icon"></i>

        <p class="chatbot-empty-title">
          Hi! I'm your RAG Assistant.
        </p>

        <p class="chatbot-empty-text">
          Ask me anything about your documents!
        </p>

      </div>

      }


      <!-- Messages -->
      @for (msg of messages; track $index) {

      <div class="message-row" [class.user-message-row]="!msg.isBot">

        <div class="message-bubble" [class.bot-message]="msg.isBot" [class.user-message]="!msg.isBot">

          {{ msg.text }}

        </div>

      </div>

      }


      <!-- =========================
             AI LOADING / TYPING
        ========================== -->
      @if (isLoading) {

      <div class="message-row bot-loading-row">

        <div class="loading-bubble">

          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>

          <span class="loading-text">
            AI is thinking...
          </span>

        </div>

      </div>

      }

    </div>


    <!-- =========================
           INPUT FOOTER
      ========================== -->
    <div class="chatbot-footer">

      <div class="chat-input-wrapper">

        <input type="text" class="chat-input" placeholder="Ask something..." [(ngModel)]="currentQuery"
          (keyup.enter)="sendMessage()" [disabled]="isLoading" aria-label="Ask Talent-Hub AI" />

        <button type="button" class="send-button" (click)="sendMessage()" [disabled]="isLoading || !currentQuery.trim()"
          aria-label="Send message">

          @if (isLoading) {

          <span class="send-spinner"></span>

          } @else {

          <i class="bi bi-send-fill"></i>

          }

        </button>

      </div>

    </div>

  </div>

  }


  <!-- =========================
       FLOATING CHAT BUTTON
  ========================== -->
  <button type="button" class="chatbot-toggle" [class.chatbot-toggle-open]="isOpen" (click)="toggleChat()"
    aria-label="Open AI chatbot">

    <img src="/AI intelligence.png" alt="AI Chatbot" />

    @if (!isOpen && messages.length === 0) {

    <span class="chatbot-notification">
      <span class="visually-hidden">
        New alerts
      </span>
    </span>

    }

  </button>

</div>
