<div class="chatbot-wrapper position-fixed bottom-0 end-0 m-4" style="z-index: 1050;">

  @if(isOpen) {
  <div class="chatbot-window bg-white rounded-4 shadow-lg d-flex flex-column mb-3"
    style="width: 360px; height: 500px; border: 1px solid #e5e7eb; overflow: hidden;">

    <!-- Premium Glassmorphism Header -->
    <div class="chatbot-header p-3 text-white d-flex justify-content-between align-items-center shadow-sm"
      style="background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);">
      <div class="d-flex align-items-center">
        <div
          class="bg-white text-primary rounded-circle d-flex align-items-center justify-content-center me-2 shadow-sm"
          style="width: 32px; height: 32px;">
          <i class="bi bi-robot fs-5"></i>
        </div>
        <div>
          <h6 class="mb-0 fw-bold">Talent-Hub AI</h6>
          <small class="text-white-50 d-block" style="font-size: 0.75rem;">Powered by Gemini</small>
        </div>
      </div>
      <button class="btn btn-sm btn-link text-white p-0 opacity-75 hover-opacity-100" (click)="toggleChat()">
        <i class="bi bi-x-lg fs-5"></i>
      </button>
    </div>

    <!-- Chat Body -->
    <div class="chatbot-body flex-grow-1 p-3 overflow-y-auto d-flex flex-column gap-3"
      style="background-color: #f9fafb;">
      @if (messages.length === 0) {
      <div class="text-center text-muted small mt-4 pt-4">
        <i class="bi bi-chat-square-stars fs-1 text-primary opacity-50 mb-2 d-block"></i>
        <p class="mb-0">Hi! I'm your RAG Assistant.</p>
        <p>Ask me anything about your documents!</p>
      </div>
      }

      @for (msg of messages; track $index) {
      <div class="d-flex" [ngClass]="{'justify-content-end': !msg.isBot}">
        <div class="p-2 px-3 rounded-4 shadow-sm" style="max-width: 85%; font-size: 0.9rem; line-height: 1.5;"
          [ngClass]="msg.isBot ? 'bg-white text-dark border' : 'text-white'"
          [style.background]="msg.isBot ? '' : 'linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%)'">
          {{ msg.text }}
        </div>
      </div>
      }

      @if (isLoading) {
      <div class="d-flex">
        <div class="p-2 px-3 rounded-4 shadow-sm bg-white text-dark border d-flex align-items-center gap-1"
          style="max-width: 85%;">
          <div class="spinner-grow spinner-grow-sm text-primary opacity-75" role="status"
            style="width: 0.4rem; height: 0.4rem;"></div>
          <div class="spinner-grow spinner-grow-sm text-primary opacity-75" role="status"
            style="width: 0.4rem; height: 0.4rem; animation-delay: 0.2s;"></div>
          <div class="spinner-grow spinner-grow-sm text-primary opacity-75" role="status"
            style="width: 0.4rem; height: 0.4rem; animation-delay: 0.4s;"></div>
        </div>
      </div>
      }
    </div>

    <!-- Input Footer -->
    <div class="chatbot-footer p-3 bg-white border-top shadow-sm">
      <div class="input-group bg-light rounded-pill border p-1 d-flex align-items-center transition-all focus-ring">
        <input type="text" class="form-control border-0 bg-transparent shadow-none ms-2" placeholder="Ask something..."
          [(ngModel)]="currentQuery" (keyup.enter)="sendMessage()" [disabled]="isLoading">
        <button class="btn rounded-circle d-flex align-items-center justify-content-center me-1 text-white shadow-sm"
          style="width: 36px; height: 36px; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); transition: transform 0.2s;"
          (click)="sendMessage()" [disabled]="isLoading || !currentQuery.trim()"
          onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
          <i class="bi bi-send-fill" style="font-size: 0.8rem;"></i>
        </button>
      </div>
    </div>
  </div>
  }

  <!-- Floating Toggle Button -->
  <button
    class="btn rounded-circle shadow-lg d-flex align-items-center justify-content-center ms-auto p-0 border-0 overflow-hidden position-relative"
    style="width: 65px; height: 65px; transition: transform 0.2s; " (click)=" toggleChat()"
    onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
    <img src="/AI intelligence.png" alt="AI Chatbot"
      style="width: 100%; height: 100%; object-fit: cover; opacity: 0.9;">
    @if (!isOpen && messages.length === 0) {
    <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle">
      <span class="visually-hidden">New alerts</span>
    </span>
    }
  </button>
</div>
