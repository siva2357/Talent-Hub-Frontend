<div class="card meet-card border-0 rounded-4 p-4 position-relative w-100 overflow-hidden" style="max-width: 480px; font-family: 'Inter', sans-serif; background: #fff; box-shadow: 0 12px 35px -12px rgba(0,0,0,0.08);">

    <div class="d-flex justify-content-between align-items-start mb-3 ps-2">
        <div>
            <div class="d-flex align-items-center gap-2 mb-2">
                <span class="badge rounded-pill fw-bold px-3 py-1 shadow-sm" style="background-color: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; font-size: 10px; letter-spacing: 0.5px;">UPCOMING</span>
            </div>
            <h5 class="fw-bolder text-dark mb-1" style="letter-spacing: -0.3px;">Technical Interview</h5>

                <img src="https://ui-avatars.com/api/?name=SP&background=f3f4f6&color=374151&size=24" class="rounded-circle" width="24" height="24">
                Siva Prasad Kurra
            </p>
        </div>
        <div class="date-box rounded-4 text-center p-2 d-flex flex-column align-items-center justify-content-center shadow-sm" style="width: 60px; height: 60px; background: linear-gradient(135deg, #f8fafc, #f1f5f9); border: 1px solid #e2e8f0;">

        </div>
        <div>
            <button class="btn rounded-pill fw-bold shadow-sm d-flex align-items-center gap-2 px-4 py-2 transition-all hover-lift" style="background: linear-gradient(45deg, #2563eb, #4f46e5); color: white; border: none; font-size: 13px; white-space: nowrap;">
