<nav class="public-navbar-wrapper">
    <div class="public-navbar container-fluid">

        <!-- =========================
             LOGO
        ========================== -->
        <a routerLink="/" class="navbar-logo" aria-label="Talent Hub Home">

            <img src="/logo%202.png" alt="Talent Hub Logo" class="logo">
        </a>


        <!-- =========================
             MOBILE MENU TOGGLE
        ========================== -->
        <button type="button" class="mobile-menu-toggle" [class.open]="mobileMenuOpen" (click)="toggleMobileMenu()"
            [attr.aria-expanded]="mobileMenuOpen" aria-label="Toggle navigation menu">

            <span></span>
            <span></span>
            <span></span>

        </button>


        <!-- =========================
             NAVIGATION
        ========================== -->
        <div class="navbar-navigation" [class.mobile-open]="mobileMenuOpen">

            <ul class="navbar-links">

                <li>
                    <a routerLink="/find-work" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                        class="nav-link" (click)="closeMobileMenu()">

                        Find work

                    </a>
                </li>


                <li>
                    <a routerLink="/hire-talent" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                        class="nav-link" (click)="closeMobileMenu()">

                        Hire talent

                    </a>
                </li>


                <li>
                    <a routerLink="/why-talent-hub" routerLinkActive="active"
                        [routerLinkActiveOptions]="{ exact: true }" class="nav-link" (click)="closeMobileMenu()">

                        Why talent hub

                    </a>
                </li>


                <li>
                    <a routerLink="/about-us" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                        class="nav-link" (click)="closeMobileMenu()">

                        About Us

                    </a>
                </li>


                <li>
                    <a routerLink="/blog" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                        class="nav-link" (click)="closeMobileMenu()">

                        Blog

                    </a>
                </li>

            </ul>


            <!-- =========================
                 AUTH BUTTONS
            ========================== -->
            <div class="navbar-actions">

                <app-button label="Login" variant="outline-primary" size="sm" route="/login" target="_blank"
                    (clicked)="closeMobileMenu()">
                </app-button>


                <app-button label="Sign Up" variant="primary" size="sm" route="/signup" target="_blank"
                    (clicked)="closeMobileMenu()">
                </app-button>

            </div>

        </div>

    </div>
</nav>
