<aside class="modern-sidebar" [class.open]="isOpen">
  <div class="sidebar-header">
    <button class="hamburger-btn" (click)="toggleSidebar()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <div class="logo">
      <img src="/logo 2.png" alt="TalentHub Logo" class="logo-img">
    </div>
  </div>

  <div class="sidebar-nav">
    @for (section of navSections; track section.title) {
      <div class="nav-section">
        <span class="nav-section-title">{{ section.title }}</span>
        @for (link of section.links; track link.path) {
          <a [routerLink]="link.path" routerLinkActive="active" class="nav-item">
            <i class="nav-icon" [ngClass]="link.icon"></i>
            <span class="nav-text">{{ link.label }}</span>
          </a>
        }
      </div>
    }
  </div>
</aside>

@if (isOpen) {
  <div class="sidebar-overlay" (click)="toggleSidebar()"></div>
}
