<div class="toast" [class]="'toast toast-' + variant" role="alert" aria-live="assertive" aria-atomic="true">

    @if (icon) {

    <i [class]="icon + ' toast-icon-custom'" aria-hidden="true">
    </i>

    }


    <div class="toast-body">

        @if (title) {

        <div class="toast-heading">
            {{ title }}
        </div>

        }


        @if (message) {

        <p>
            {{ message }}
        </p>

        }

    </div>


    @if (closable) {

    <button type="button" class="btn-close" aria-label="Close" (click)="onClose()">

        <i class="bi bi-x"></i>

    </button>

    }

</div>
