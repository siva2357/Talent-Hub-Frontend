<span [class]="'badge ' +
    (appearance === 'outline'
      ? 'badge-outline-' + variant
      : appearance === 'subtle'
        ? 'bg-' + variant + '-subtle'
        : 'bg-' + variant) +
    (rounded ? ' rounded-pill' : '')">

    @if (icon) {
    <i [class]="icon"></i>
    }

    @if (label) {
    <span>{{ label }}</span>
    }

    @if (count !== null) {
    <span class="badge-count">
        {{ count }}
    </span>
    }

</span>
