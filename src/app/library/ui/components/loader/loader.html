<div class="loader-showcase border border-dark border-1 rounded-3"
    style="padding: 40px; font-family: 'Inter', sans-serif; background: #fff; max-width: 1200px; margin: 0 auto; color: #000000;">
    <h1 style="font-size: 18px; font-weight: 700; color: #2563eb; margin-bottom: 8px;">3. LOADERS</h1>
    <p style="color: #6b7280; font-size: 13px; margin-bottom: 32px;">Loaders indicate ongoing processes and provide
        feedback.</p>

    <div style="display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 40px; align-items: stretch;">

        <!-- 3.1. SPINNER LOADERS -->
        <section style="border-right: 1px solid #e5e7eb; padding-right: 40px;">
            <h2
                style="font-size: 12px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 24px;">
                3.1. Spinner Loaders</h2>

            <div style="display: flex; gap: 24px; align-items: center; padding-top: 16px;">
                <!-- Standard Spinner -->
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>

                <!-- Dotted Spinner -->
                <div class="spinner-border text-primary spinner-dotted" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>

                <!-- Thick Spinner -->
                <div class="spinner-border text-primary spinner-thick" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>

                <!-- Track Spinner -->
                <div class="spinner-track" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </section>

        <!-- 3.2. PROGRESS LOADERS -->
        <section style="border-right: 1px solid #e5e7eb; padding-right: 40px;">
            <h2
                style="font-size: 12px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 24px;">
                3.2. Progress Loaders</h2>

            <div style="display: flex; flex-direction: column; gap: 24px; padding-top: 8px;">

                <!-- 60% Standard -->
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div class="progress flex-grow-1">
                        <div class="progress-bar" style="width: 60%"></div>
                    </div>
                    <span style="font-size: 13px; font-weight: 500; color: #4b5563; width: 32px;">60%</span>
                </div>

                <!-- 45% Striped & Animated -->
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div class="progress flex-grow-1">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 45%"></div>
                    </div>
                    <span style="font-size: 13px; font-weight: 500; color: #4b5563; width: 32px;">45%</span>
                </div>

                <!-- 30% With Handle -->
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div class="progress progress-with-handle flex-grow-1">
                        <div class="progress-bar" style="width: 30%"></div>
                    </div>
                    <span style="font-size: 13px; font-weight: 500; color: #4b5563; width: 32px;">30%</span>
                </div>

            </div>
        </section>

        <!-- 3.3. CIRCULAR PROGRESS -->
        <section>
            <h2
                style="font-size: 12px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 24px;">
                3.3. Circular Progress</h2>

            <div style="display: flex; gap: 24px; align-items: center; padding-top: 8px;">

                <!-- 25% Thin -->
                <div class="circular-progress circle-size ring-thin"
                    style="background: conic-gradient(#2563eb 25%, #f3f4f6 0);">
                    <span>25%</span>
                </div>

                <!-- 50% Medium -->
                <div class="circular-progress circle-size ring-md"
                    style="background: conic-gradient(#2563eb 50%, #f3f4f6 0);">
                    <span>50%</span>
                </div>

                <!-- 75% Thick Success -->
                <div class="circular-progress circle-size ring-thick"
                    style="background: conic-gradient(#10b981 75%, #f3f4f6 0);">
                    <span>75%</span>
                </div>

            </div>
        </section>

    </div>
</div>
