<!-- SPINNER -->

@if (type === 'spinner') {

@if (spinnerVariant === 'track') {

<div class="spinner-track" role="status" aria-label="Loading">
</div>

} @else {

<div class="spinner-border text-primary" [class.spinner-dotted]="spinnerVariant === 'dotted'"
    [class.spinner-thick]="spinnerVariant === 'thick'" role="status" aria-label="Loading">
    <span class="visually-hidden">
        Loading...
    </span>
</div>

}

}


<!-- PROGRESS -->

@if (type === 'progress') {

<div class="d-flex align-items-center gap-3">

    <div class="progress flex-grow-1">

        <div class="progress-bar" [class.progress-bar-striped]="
          progressVariant === 'striped' ||
          progressVariant === 'animated'
        " [class.progress-bar-animated]="
          progressVariant === 'animated'
        " [class.progress-with-handle]="
          progressVariant === 'handle'
        " [style.width.%]="safeProgress"></div>

    </div>

    @if (showPercentage) {
    <span style="
          font-size: 13px;
          font-weight: 500;
          color: #4b5563;
          width: 32px;
        ">
        {{ safeProgress }}%
    </span>
    }

</div>

}


<!-- CIRCULAR PROGRESS -->

@if (type === 'circular') {

<div class="circular-progress circle-size" [class.ring-thin]="circularVariant === 'thin'"
    [class.ring-md]="circularVariant === 'md'" [class.ring-thick]="circularVariant === 'thick'" [style.background]="
      'conic-gradient(' +
      circularColor +
      ' ' +
      safeProgress +
      '%, #f3f4f6 0)'
    " role="progressbar" [attr.aria-valuenow]="safeProgress" aria-valuemin="0" aria-valuemax="100">
    @if (showPercentage) {
    <span>{{ safeProgress }}%</span>
    }
</div>

}
