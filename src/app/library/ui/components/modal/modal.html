@if (open) {

<div class="modal-backdrop-custom">

    <div class="modal-dialog" [class.modal-sm]="size === 'sm'" [class.modal-md]="size === 'md'"
        [class.modal-lg]="size === 'lg'">

        <div class="modal-content shadow-lg border-0 rounded-4">

            <div class="modal-body custom-p position-relative" [class.modal-centered]="variant === 'icon'">

                <!-- Close -->
                @if (showClose) {

                <button type="button" class="custom-close" aria-label="Close" (click)="onClose()">

                    <i class="bi bi-x-lg"></i>

                </button>

                }

                <!-- Icon -->
                @if (variant === 'icon') {

                <div class="modal-icon-container" [class]="'modal-icon-container icon-' + iconVariant">

                    <i [class]="icon"></i>

                </div>

                }

                <!-- Title -->
                @if (title) {

                <h3 class="modal-custom-title">
                    {{ title }}
                </h3>

                }

                <!-- Message -->
                @if (message) {

                <p class="modal-custom-text">
                    {{ message }}
                </p>

                }

                <!-- Actions -->
                @if (showActions) {

                <div class="modal-actions" [class.modal-actions-centered]="variant === 'icon'">

                    @if (showCancel) {

                    <app-button
                        type="button"
                        [variant]="cancelVariant"
                        size="sm"
                        [label]="cancelLabel"
                        [block]="variant === 'icon'"
                        (clicked)="onCancel()">
                    </app-button>

                    }

                    <app-button
                        type="button"
                        [variant]="confirmVariant"
                        size="sm"
                        [label]="confirmLabel"
                        [block]="variant === 'icon'"
                        (clicked)="onConfirm()">
                    </app-button>

                </div>

                }

            </div>

        </div>

    </div>

</div>

}
