<div class="chip-showcase border border-dark border-1 rounded-3"
    style="padding: 40px; font-family: 'Inter', sans-serif; background: #fff; max-width: 1000px; margin: 0 auto; color: #000000;">
    <h1 style="font-size: 18px; font-weight: 700; color: #2563eb; margin-bottom: 8px;">1. CHIPS</h1>
    <p style="color: #6b7280; font-size: 13px; margin-bottom: 32px;">Chips represent compact items, filters, or
        selections.</p>

    <div style="display: flex; flex-direction: column; gap: 32px;">

        <!-- 1.1. INPUT / FILTER CHIPS -->
        <section>
            <h2
                style="font-size: 12px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 16px;">
                1.1. Input / Filter Chips</h2>

            <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px;">
                <div class="chip chip-primary-subtle">
                    <span class="chip-icon"><i class="bi bi-tag"></i></span>
                    Angular
                    <button class="chip-close"><i class="bi bi-x"></i></button>
                </div>
                <div class="chip chip-primary-subtle">
                    <span class="chip-icon"><i class="bi bi-tag"></i></span>
                    React
                    <button class="chip-close"><i class="bi bi-x"></i></button>
                </div>
                <div class="chip chip-primary-subtle">
                    <span class="chip-icon"><i class="bi bi-tag"></i></span>
                    UI/UX
                    <button class="chip-close"><i class="bi bi-x"></i></button>
                </div>
                <div class="chip chip-primary-subtle">
                    Design
                    <button class="chip-close"><i class="bi bi-x"></i></button>
                </div>
                <div class="chip chip-primary-subtle">
                    TypeScript
                    <button class="chip-close"><i class="bi bi-x"></i></button>
                </div>
            </div>

            <div style="display: flex; flex-wrap: wrap; gap: 12px;">
                <div class="chip chip-danger-subtle">
                    High Priority
                    <button class="chip-close"><i class="bi bi-x"></i></button>
                </div>
                <div class="chip chip-primary-subtle">
                    In Progress
                    <button class="chip-close"><i class="bi bi-x"></i></button>
                </div>
                <div class="chip chip-success-subtle">
                    Completed
                    <button class="chip-close"><i class="bi bi-x"></i></button>
                </div>
                <div class="chip chip-warning-subtle">
                    On Hold
                    <button class="chip-close"><i class="bi bi-x"></i></button>
                </div>
                <button class="chip chip-outline chip-dashed">
                    <span class="chip-icon"><i class="bi bi-plus"></i></span>
                    Add Filter
                </button>
            </div>
        </section>

        <!-- 1.3. ASSIST / SUGGESTION CHIPS -->
        <section>
            <h2
                style="font-size: 12px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 16px;">
                1.3. Assist / Suggestion Chips</h2>

            <div style="display: flex; flex-wrap: wrap; gap: 12px;">
                <button class="chip chip-outline">
                    <span class="chip-icon"><i class="bi bi-search"></i></span>
                    Search
                </button>
                <button class="chip chip-outline">
                    <span class="chip-icon"><i class="bi bi-calendar"></i></span>
                    Today
                </button>
                <button class="chip chip-outline">
                    <span class="chip-icon"><i class="bi bi-funnel"></i></span>
                    Filter
                </button>
                <button class="chip chip-outline">
                    <span class="chip-icon"><i class="bi bi-download"></i></span>
                    Download
                </button>
                <button class="chip chip-outline">
                    <span class="chip-icon"><i class="bi bi-share"></i></span>
                    Share
                </button>
                <button class="chip chip-outline">
                    <span class="chip-icon"><i class="bi bi-plus"></i></span>
                    Invite
                </button>
            </div>
        </section>

        <!-- 1.4. CHIPS WITH ICONS -->
        <section>
            <h2
                style="font-size: 12px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 16px;">
                1.4. Chips With Icons</h2>

            <div style="display: flex; flex-wrap: wrap; gap: 12px;">
                <button class="chip chip-outline">
                    <span class="chip-icon"><i class="bi bi-envelope"></i></span>
                    Email
                </button>
                <button class="chip chip-outline">
                    <span class="chip-icon"><i class="bi bi-telephone"></i></span>
                    Phone
                </button>
                <button class="chip chip-outline">
                    <span class="chip-icon"><i class="bi bi-geo-alt"></i></span>
                    Location
                </button>
                <button class="chip chip-outline">
                    <span class="chip-icon"><i class="bi bi-globe"></i></span>
                    Website
                </button>
                <button class="chip chip-outline">
                    <span class="chip-icon"><i class="bi bi-three-dots"></i></span>
                    More
                </button>
            </div>
        </section>

    </div>
</div>
